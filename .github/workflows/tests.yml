name: Python CI

on:
  push:
    branches: [test, beta, master]
  pull_request:
    branches: [beta, master]

permissions:
  contents: read

jobs:
  check:
    name: basic-check
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m compileall -q main.py flight_app tests tools
      - name: Run all tests including GUI
        run: python tools/run_tests.py --require-gui
      - name: Check data and query services
        run: python main.py --check
